apis:
- aid: paymentus:paymentus-xotp-api
  name: Paymentus XOTP API
  description: >-
    The XOTP (Paymentus payment) API exposes core Service Commerce operations —
    make payment (Sale), account inquiry, payment history, void/cancel payment,
    customer profile create/read/update/delete and list, wallet/payment-method
    tokenization, linked accounts, and AutoPay management. Requests carry a
    Bearer JWT and are scoped with granular XOTP scopes. Documented publicly via
    the @paymentus/xotp Node.js SDK and the developer portal reference tables;
    the full interactive reference requires portal access.
  humanURL: https://developer.paymentus.io/docs/Reference
  baseURL: https://api.paymentus.com
  tags:
  - Payments
  - Bill Payments
  - Tokenization
  - AutoPay
  - Disbursements
  tags_raw:
  - Payments
  - Bill Payment
  - Tokenization
  - AutoPay
  - Disbursements
  properties:
  - type: Documentation
    url: https://developer.paymentus.io/
  - type: APIReference
    url: https://developer.paymentus.io/docs/Reference
  - type: SDK
    url: https://www.npmjs.com/package/@paymentus/xotp
- aid: paymentus:paymentus-authentication-api
  name: Paymentus Authentication API
  description: >-
    The Authentication API issues short-lived JWT access tokens for the XOTP
    payment surface. A client signs a request with a pre-shared key (identified
    by a key id / kid and a three-letter application acronym / tla), declares the
    granular scopes it needs (for example xotp, xotp:profile, xotp:payment,
    xotp:autopay, xotp:accounts) or a pixel that maps to those scopes, and
    receives a Bearer token used on subsequent XOTP calls. Documented publicly
    via the @paymentus/auth Node.js SDK.
  humanURL: https://developer.paymentus.io/
  baseURL: https://api.paymentus.com
  tags:
  - Authentication
  - JWT
  - Scopes
  properties:
  - type: Documentation
    url: https://developer.paymentus.io/
  - type: SDK
    url: https://www.npmjs.com/package/@paymentus/auth
