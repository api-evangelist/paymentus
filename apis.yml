name: Paymentus
kind: company
description: >-
  Paymentus (NYSE: PAY) is a Addison, Texas-based cloud billing and payment
  technology company founded in 2004 that operates one of the largest electronic
  bill presentment and payment (EBPP) networks in North America. Its Intelligent
  Payment Platform, Instant Payment Network (IPN), BillWallet, and Profit by
  Paymentus (AP/AR) products let utilities, government agencies, insurers,
  telecom, healthcare, higher education, and financial institutions accept and
  disburse payments across web, mobile, IVR, call center, and agent channels
  using cards, ACH/eCheck, cash, and digital wallets (PayPal, Venmo, Apple Pay,
  Google Pay). Its home market is the United States. Paymentus is API-native but
  its developer surface is access-controlled: the developer portal at
  developer.paymentus.io is live and public, yet the full API reference,
  specifications, and testing environment sit behind a request-access / NDA
  gate. A public Node.js Server SDK (@paymentus/core, @paymentus/auth,
  @paymentus/xotp) documents the real payment (XOTP) surface, JWT/pre-shared-key
  authentication, granular OAuth-style scopes, and production base URLs. No
  downloadable OpenAPI/Swagger specification is published on the public web as of
  this review.
